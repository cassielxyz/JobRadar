name: Apply v0.9 release bundle

on:
  push:
    branches: [main]
    paths:
      - 'scripts/jobradar-v09-release.tgz.b64'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: jobradar-v09-release
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract release bundle
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/jobradar-v09-release.tgz.b64 > /tmp/jobradar-v09.tgz
          echo 'eac581cca62e987d78dc099ab96e9d25dc62ee8e2a77b05a69319cb585154d2a  /tmp/jobradar-v09.tgz' | sha256sum -c -
          python - <<'PY'
          import os, tarfile
          root=os.path.realpath(os.getcwd())
          with tarfile.open('/tmp/jobradar-v09.tgz','r:gz') as tf:
              members=tf.getmembers()
              for m in members:
                  target=os.path.realpath(os.path.join(root,m.name))
                  if target != root and not target.startswith(root+os.sep):
                      raise SystemExit('unsafe bundle path: '+m.name)
                  if m.issym() or m.islnk():
                      raise SystemExit('links are not allowed: '+m.name)
              tf.extractall(root,members=members)
              print(f'Applied {len(members)} v0.9 files')
          PY
      - name: Remove temporary release helper
        run: |
          rm -f scripts/jobradar-v09-release.tgz.b64
          rm -f .github/workflows/apply-v09-release.yml
      - name: Commit JobRadar Everywhere v0.9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: JobRadar Everywhere v0.9 fresher rules and editable integrations'
          git push origin HEAD:main
