name: Apply v0.9 full release

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v09-full.part07'

permissions:
  contents: write
  actions: write

concurrency:
  group: jobradar-v09-full-release
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify v0.9 bundle
        shell: bash
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 05 06 07; do test -s "scripts/v09-full.part${i}"; done
          cat scripts/v09-full.part00 scripts/v09-full.part01 scripts/v09-full.part02 scripts/v09-full.part03 scripts/v09-full.part04 scripts/v09-full.part05 scripts/v09-full.part06 scripts/v09-full.part07 | base64 -d > /tmp/v09.tar.xz
          echo '3805579a21b3e712987d17f2edadcd485575123e5d827b9756135408a99bf128  /tmp/v09.tar.xz' | sha256sum -c -
          xz -dc /tmp/v09.tar.xz > /tmp/v09.tar
          echo 'a7132ced250bd6935db7b910646e9e375862fc739d42fea20c8414d6745da864  /tmp/v09.tar' | sha256sum -c -
          python - <<'PY'
          import os, tarfile
          root=os.path.realpath(os.getcwd())
          with tarfile.open('/tmp/v09.tar','r:') as tf:
              members=tf.getmembers()
              for m in members:
                  target=os.path.realpath(os.path.join(root,m.name))
                  if target != root and not target.startswith(root+os.sep):
                      raise SystemExit('unsafe bundle path: '+m.name)
                  if m.issym() or m.islnk():
                      raise SystemExit('links are not allowed: '+m.name)
              tf.extractall(root,members=members)
              print(f'Applied {len(members)} JobRadar Everywhere v0.9 files')
          PY

      - name: Test Python collector
        run: |
          python -m pip install -r collector/requirements.txt
          python -m pytest collector/tests -q
          python -m compileall -q collector/jobradar

      - name: Test production dashboard build
        working-directory: apps/web
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run build

      - name: Remove temporary release staging
        run: |
          rm -f scripts/v09-full.part*
          rm -f scripts/v09-patch.part*
          rm -f scripts/v09-readme.part*
          rm -f scripts/jobradar-v09-release.part*
          rm -f .github/workflows/apply-v09-release.yml

      - name: Commit JobRadar Everywhere v0.9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: JobRadar Everywhere v0.9 fresher rules, editable categories and integrations'
          git push origin HEAD:main
