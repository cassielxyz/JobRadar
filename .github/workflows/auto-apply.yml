name: Safe auto apply
on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobradar-auto-apply
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ vars.AUTO_APPLY_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements-auto.txt
      - run: pip install -r collector/requirements-auto.txt
      - run: python -m playwright install --with-deps chromium
      - name: Process high-confidence application queue
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m jobradar.auto_apply
