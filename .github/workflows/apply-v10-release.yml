name: Apply JobRadar Everywhere v1.0

on:
  push:
    branches: [v10-stage]
    paths:
      - 'scripts/apply_v10.py'
      - 'apps/web/lib/learning-resources.ts'
      - '.github/workflows/apply-v10-release.yml'

permissions:
  contents: write

concurrency:
  group: jobradar-v10-release
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-stage
          fetch-depth: 0
      - name: Apply v1.0 patch
        run: python scripts/apply_v10.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test collector
        run: pip install -r collector/requirements.txt pytest && cd collector && pytest -q && python -m compileall -q jobradar
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Production dashboard build
        working-directory: apps/web
        run: npm install --package-lock=false --no-audit --no-fund && npm run build
      - name: Commit validated v1.0 to main
        run: |
          rm -f scripts/apply_v10.py .github/workflows/apply-v10-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: JobRadar Everywhere v1.0 trust, category isolation and ATS resume studio'
          git push origin HEAD:main
