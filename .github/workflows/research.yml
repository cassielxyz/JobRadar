name: Job research
on:
  schedule:
    - cron: '35 1,7,13 * * *' # 07:05, 12:35, 18:35 IST approx; GitHub schedules may be delayed.
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: jobradar-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r collector/requirements.txt
      - name: Install GitHub Copilot CLI
        if: ${{ vars.AI_MODE != 'rules' && vars.AI_MODE != 'gemini' }}
        run: npm install -g @github/copilot
      - name: Optional Agent Reach install
        if: ${{ vars.AGENT_REACH_ENABLED == 'true' }}
        run: |
          pip install https://github.com/Panniantong/agent-reach/archive/main.zip
          agent-reach install --env=auto || true
      - name: Research, verify, dual-AI review, score and alert
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_MODE: ${{ vars.AI_MODE }}
          AI_REVIEW_MIN_SCORE: ${{ vars.AI_REVIEW_MIN_SCORE }}
          # Copilot CLI can authenticate in Actions with this short-lived built-in token.
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          AGENT_REACH_ENABLED: ${{ vars.AGENT_REACH_ENABLED }}
        run: python -m jobradar.main --trigger github-actions
