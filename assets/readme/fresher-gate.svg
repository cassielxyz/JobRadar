<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" fill="none"><rect width="1400" height="360" rx="28" fill="#FAFBFC"/><text x="64" y="64" font-family="Arial" font-size="24" font-weight="800" fill="#111318">Fresher-only is a category switch — not a global rule</text><g font-family="Arial"><rect x="64" y="105" width="370" height="190" rx="20" fill="#FFF" stroke="#DDE1E7"/><text x="92" y="145" font-size="14" font-weight="800" fill="#7C3AED">FRESHER-ONLY: ON</text><text x="92" y="181" font-size="19" font-weight="800" fill="#111318">Startup Fresher Jobs</text><text x="92" y="216" font-size="12" fill="#68717C">Rejects explicit 2+ years, minimum 2 years,</text><text x="92" y="238" font-size="12" fill="#68717C">senior/lead titles and experience over the limit.</text><rect x="92" y="258" width="157" height="24" rx="12" fill="#F3FBF7" stroke="#CAE9DB"/><text x="108" y="275" font-size="10" font-weight="700" fill="#276A4E">0–2 YEARS → PASS</text><rect x="258" y="258" width="148" height="24" rx="12" fill="#FFF5F5" stroke="#F2CACA"/><text x="276" y="275" font-size="10" font-weight="700" fill="#9C3F3F">2+ YEARS → REJECT</text><rect x="512" y="105" width="370" height="190" rx="20" fill="#FFF" stroke="#DDE1E7"/><text x="540" y="145" font-size="14" font-weight="800" fill="#06B6D4">FRESHER-ONLY: OFF</text><text x="540" y="181" font-size="19" font-weight="800" fill="#111318">General Cybersecurity</text><text x="540" y="216" font-size="12" fill="#68717C">Experience is still scored and displayed, but it is</text><text x="540" y="238" font-size="12" fill="#68717C">not an automatic rejection unless your own rules say so.</text><rect x="540" y="258" width="205" height="24" rx="12" fill="#F3F8FC" stroke="#C9DFEE"/><text x="557" y="275" font-size="10" font-weight="700" fill="#2D6689">2+ YEARS → RANKING SIGNAL</text><path d="M458 198h30" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/><path d="m480 190 10 8-10 8" stroke="#8B5CF6" stroke-width="3"/></g><g transform="translate(958 105)" font-family="Arial"><rect width="378" height="190" rx="20" fill="#111318"/><text x="28" y="43" font-size="14" font-weight="800" fill="#EC4899">EDIT ANY CATEGORY</text><text x="28" y="80" font-size="18" font-weight="800" fill="#FFF">Locations · roles · exclusions</text><text x="28" y="110" font-size="18" font-weight="800" fill="#FFF">experience · salary · sources</text><text x="28" y="140" font-size="18" font-weight="800" fill="#FFF">alert score · fresher-only</text><text x="28" y="169" font-size="11" fill="#B8BFCA">Changes are saved to Supabase and used by the next run.</text></g></svg>
