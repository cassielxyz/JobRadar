# JobRadar Everywhere discovery catalog
#
# These are discovery targets, not automatically trusted Apply destinations.
# JobRadar still verifies role relevance, fresher/experience rules, location, liveness,
# and application links before a result can appear as a verified match.
#
# Direct scraping/login automation is intentionally avoided. Agent Reach / Exa uses
# public web discovery and JobRadar resolves the final application destination.

